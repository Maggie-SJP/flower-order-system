<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wild Facts Quiz</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- START SCREEN -->
    <section id="start-screen" class="screen active">
      <div class="card start-card">
        <div class="logo">🦁🐙🦉</div>
        <h1>Wild Facts Quiz</h1>
        <p class="subtitle">10 wild animal facts most people don't know.<br/>Answer fast for bonus points!</p>
        <button id="start-btn" class="btn btn-primary">Start Quiz</button>
      </div>
    </section>

    <!-- QUESTION SCREEN -->
    <section id="quiz-screen" class="screen">
      <header class="quiz-header">
        <div class="progress-wrap">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="quiz-meta">
          <span id="question-count">Question 1 / 10</span>
          <span id="score-display">Score: 0</span>
        </div>
      </header>

      <div class="timer-wrap">
        <div id="timer-bar" class="timer-bar"></div>
      </div>

      <div class="card question-card">
        <h2 id="question-text">Question text</h2>
      </div>

      <div id="answers-grid" class="answers-grid">
        <button class="answer-btn shape-triangle" data-index="0">
          <span class="shape">▲</span><span class="answer-text"></span>
        </button>
        <button class="answer-btn shape-diamond" data-index="1">
          <span class="shape">◆</span><span class="answer-text"></span>
        </button>
        <button class="answer-btn shape-circle" data-index="2">
          <span class="shape">●</span><span class="answer-text"></span>
        </button>
        <button class="answer-btn shape-square" data-index="3">
          <span class="shape">■</span><span class="answer-text"></span>
        </button>
      </div>
    </section>

    <!-- FEEDBACK SCREEN -->
    <section id="feedback-screen" class="screen">
      <div id="feedback-card" class="card feedback-card">
        <div id="feedback-icon" class="feedback-icon">✔</div>
        <h2 id="feedback-title">Correct!</h2>
        <p id="feedback-correct-answer" class="feedback-correct-answer"></p>
        <p id="feedback-fact" class="feedback-fact"></p>
        <div id="feedback-points" class="feedback-points"></div>
        <button id="next-btn" class="btn btn-primary">Next Question</button>
      </div>
    </section>

    <!-- RESULTS SCREEN -->
    <section id="results-screen" class="screen">
      <div class="card results-card">
        <div id="results-emoji" class="results-emoji">🏆</div>
        <h1>Quiz Complete!</h1>
        <p id="results-rank" class="results-rank">Wildlife Expert</p>
        <div class="results-score">
          <div class="results-score-number" id="final-score">0</div>
          <div class="results-score-label">points</div>
        </div>
        <p id="results-correct" class="results-correct">You got 0 / 10 correct</p>
        <button id="restart-btn" class="btn btn-primary">Play Again</button>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
